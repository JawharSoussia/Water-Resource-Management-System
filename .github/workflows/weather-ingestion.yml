name: Hourly weather ingestion

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ingestion dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ingestion.txt

      - name: Load current weather into PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/load_weather.py
      - name: Verify warehouse rows
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "from scripts.load_weather import database_engine; from sqlalchemy import text; e=database_engine(); print(dict(e.connect().execute(text(\"SELECT (SELECT COUNT(*) FROM staging.stg_weather) AS staging_rows, (SELECT COUNT(*) FROM marts.weather_daily_summary) AS summary_rows\" )).mappings().one()))"
